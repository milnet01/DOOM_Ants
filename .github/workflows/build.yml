name: build

# Light CI: confirm the engine still compiles on Linux and the unit tests pass on
# every push / PR to master. This is a compile + test gate only -- it cannot run the
# game (no display, GPU, or licensed WAD on the runner), and it deliberately does
# NOT build the Windows cross-target or cut releases (those stay local, via
# packaging/release.sh). See docs/RELEASE_README.txt.
#
# Run the exact same gate locally before pushing with:  packaging/ci-local.sh
# It mirrors BOTH jobs below and this workflow's docs-only paths-ignore. Install it as
# a pre-push hook once per clone with:  git config core.hooksPath packaging/hooks
#
# SPEED / SAFETY: the fast bits here are all deterministic and cannot cause a
# false green -- (1) skip runs whose changes are docs-only, (2) cancel superseded
# runs, (3) shallow clone, (4) parallel make, (5) --no-install-recommends. We
# intentionally do NOT cache apt packages or compiler output (ccache): a stale or
# poisoned build cache is exactly the "easily corruptable" speed-up to avoid, and
# the full build is only ~90 s anyway. (ccache is hash-keyed and safe in practice
# if we ever want it, but it's left out by choice.)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE.TXT'
      - 'README.TXT'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE.TXT'
      - 'README.TXT'

# A newer push to the same branch cancels an in-flight run (saves runner minutes).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: both jobs only read the tree and run a compiler, so the token
# needs nothing beyond `contents: read`. Without this block it inherits whatever
# the repository default is, which is write on many repos.
permissions:
  contents: read

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15          # a hung build never sits burning minutes
    steps:
      # Pinned to the commit v7.0.1 resolves to, not the mutable `v7` tag: a tag
      # can be repointed at any commit, so a tag pin trusts whoever can move it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1         # shallow: CI only needs the current tree
          persist-credentials: false   # nothing here pushes; don't leave the token in .git/config

      - name: Install build dependencies
        # The package list lives in packaging/ci-deps.txt (single source of truth,
        # shared with packaging/ci-local.sh so the local mirror can't drift from CI).
        # glslc + xxd build the Vulkan shaders into C headers; the Makefile links
        # -lvulkan even though the runner has no GPU. mold is optional -- the Makefile
        # falls back to the default linker when it is absent.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $(awk 'NF && $1 !~ /^#/ {print $1}' packaging/ci-deps.txt)

      - name: Build (Linux)
        run: make -C linuxdoom-1.10 -j"$(nproc)"

      - name: Unit tests
        run: make -C linuxdoom-1.10 test

      # DOOM-0203: headless boot smoke. The compile + unit-test steps above never
      # actually RUN the engine; this does — it boots the built binary on the GPU-free
      # software renderer (SDL dummy video/audio, no display/GPU on the runner), warps
      # into E1M1 of a freely-licensed Freedoom IWAD, simulates 105 tics (~3 s) through
      # the real game loop, and exits 0 via the engine's -bootsmoke flag. This catches
      # boot/runtime regressions (WAD load, renderer init, level setup, per-frame draw)
      # that a build-only gate misses. The Vulkan RT/-shotverify gates need a real GPU
      # and stay on the (optional, manual) self-hosted runner — not here.
      - name: Install a free IWAD for the smoke
        run: sudo apt-get install -y --no-install-recommends freedoom

      - name: Headless boot smoke (software renderer)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -eo pipefail
          # timeout backstops a hang; pipefail makes the game's exit code (not tee's)
          # decide the step, so a crash (non-zero) or timeout (124) fails CI.
          timeout 120 ./linuxdoom-1.10/linux/linuxxdoom \
            -iwad /usr/share/games/doom/freedoom1.wad \
            -warp 1 1 -bootsmoke 105 2>&1 | tee smoke.log
          grep -q "bootsmoke: .* tics simulated OK" smoke.log

  # DOOM-0324: the Windows cross-target used to be compiled exactly once per
  # release, by packaging/release.sh. Two Windows-only compile errors accumulated
  # unnoticed across the 193 commits between v0.5.0 and v0.6.0 and surfaced only
  # when 0.6.0 was cut -- a missing <stdint.h> that glibc supplies transitively
  # and mingw does not, and a POSIX two-argument mkdir. Neither is subtle;
  # nothing was looking.
  #
  # This is the SYNTAX half only: -fsyntax-only over every translation unit,
  # which catches that whole class in seconds with no linking, no import
  # libraries and no artifact upload. It runs in parallel with the Linux job, so
  # it costs no wall-clock. Wine + Xvfb would be needed to actually boot the
  # .exe; that stays local (packaging/windows-smoke.sh with no flags), not least
  # because the Windows build currently never exits (DOOM-0325).
  windows-syntax:
    name: Windows cross-compile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the Windows cross-toolchain
        # Deliberately NOT packaging/ci-deps.txt: that list is the *Linux* build's
        # dependencies, and nothing here links or runs. Only the cross-compilers
        # plus the two generators for the embedded shader/font headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 glslc xxd

      # Stages the upstream SDL2 / SDL2_mixer / Vulkan headers and generates the
      # embedded shader + font headers itself, then sweeps every .c and .cpp.
      #
      # EXPECTED NOISE, not a failure: this step prints "Package 'sdl2' was not
      # found" a few times. The Makefile resolves the *Linux* build's SDL2 flags
      # via pkg-config when it is parsed, whatever target you asked for, and
      # libsdl2-dev is deliberately not installed above -- nothing here links
      # against it. Left unsilenced on purpose: the same message on a developer's
      # box means SDL2 really is missing, and that is worth hearing.
      - name: Syntax-check the tree against the Windows compiler
        run: packaging/windows-smoke.sh --syntax-only
