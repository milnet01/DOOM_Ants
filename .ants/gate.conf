# Read by ~/.claude/githooks/pre-push (via packaging/hooks/pre-push). A key in a
# clone's own git config wins over this file.
[ants "gate"]
	# The gate script. The hook would find it anyway; named so nothing depends on
	# the hook's discovery list.
	command = ./packaging/ci-local.sh
	# Documentation-only is decided by build.yml's own paths-ignore list.
	docsCommand = packaging/ci-local.sh --classify-docs
	docsMode = --docs
	# ci-local.sh builds from a git-archive export of HEAD, so running in place
	# only saves the hook a checkout; it is taken only on a clean tree at the
	# pushed tip, otherwise the hook uses a fresh checkout.
	inPlace = true
